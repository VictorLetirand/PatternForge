[package]
name = "pf-export"
description = "PatternForge — export SVG en mm et PDF A4 vectoriel à l'échelle 1:1"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# Un seul programme de test (tests/suite.rs) : voir son en-tête.
autotests = false

[dependencies]
pf-geometry = { workspace = true }
pf-core = { workspace = true }
pf-i18n = { workspace = true }
png = "=0.18.1"
jpeg-encoder = "=0.7.1"
miniz_oxide = "=0.8.9"

[[test]]
name = "suite"
path = "tests/suite.rs"
