<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="120mm" height="120mm" viewBox="0 0 120 120">
  <title>PatternForge — Carré étalon 100 mm</title>
  <desc>PatternForge. Unités : 1 unité = 1 mm, échelle 1:1. Contenu : pièce avec ligne de coupe.</desc>
  <g fill="none" stroke="#000000" stroke-linecap="round">
    <line x1="10" y1="110" x2="110" y2="110" data-role="coupe" stroke-width="0.6"/>
    <line x1="110" y1="110" x2="110" y2="10" data-role="coupe" stroke-width="0.6"/>
    <line x1="110" y1="10" x2="10" y2="10" data-role="coupe" stroke-width="0.6"/>
    <line x1="10" y1="10" x2="10" y2="110" data-role="coupe" stroke-width="0.6"/>
  </g>
</svg>
